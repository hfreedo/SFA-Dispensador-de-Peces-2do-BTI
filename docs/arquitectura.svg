<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura del dispensador de peces</title>
  <desc id="desc">Flujo entre navegador, servidor Python, Arduino UNO, Bluetooth, EEPROM y actuadores.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061725"/><stop offset="1" stop-color="#0c3044"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#78d7da"/></marker>
    <style>
      .box{fill:#0b2536;stroke:#78d7da;stroke-width:2;rx:18}.accent{fill:#123d50;stroke:#ffb24a}.title{font:700 29px Arial;fill:#f5fbff}.sub{font:18px Arial;fill:#b8d3da}.small{font:16px Arial;fill:#91b7c2}.line{stroke:#78d7da;stroke-width:4;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:10 8}
    </style>
  </defs>
  <rect width="1400" height="720" fill="url(#bg)"/>
  <text x="70" y="70" class="title">Arquitectura · SFA Dispensador de Peces 2.º BTI</text>
  <text x="70" y="105" class="sub">Control local, protocolo serial compartido y animaciones no bloqueantes</text>

  <rect class="box" x="70" y="185" width="270" height="155"/>
  <text x="105" y="235" class="title">Interfaz web</text>
  <text x="105" y="272" class="sub">HTML · CSS · JavaScript</text>
  <text x="105" y="305" class="small">Panel, horarios y animaciones</text>

  <rect class="box" x="450" y="185" width="300" height="155"/>
  <text x="485" y="235" class="title">Servidor Python</text>
  <text x="485" y="272" class="sub">HTTP + PySerial</text>
  <text x="485" y="305" class="small">Puertos, comandos y eventos</text>

  <rect class="box accent" x="860" y="165" width="300" height="195"/>
  <text x="900" y="225" class="title">Arduino UNO</text>
  <text x="900" y="265" class="sub">Firmware principal</text>
  <text x="900" y="302" class="small">Reloj · agenda · estados</text>
  <text x="900" y="330" class="small">Servo + LEDs no bloqueantes</text>

  <path class="line" d="M340 250 H450"/><text x="355" y="235" class="small">HTTP / SSE</text>
  <path class="line" d="M750 250 H860"/><text x="755" y="235" class="small">USB · 9600</text>
  <path class="line dash" d="M860 315 H755"/>

  <rect class="box" x="70" y="465" width="270" height="130"/>
  <text x="105" y="515" class="title">HC-06</text>
  <text x="105" y="553" class="sub">Bluetooth · 9600</text>
  <path class="line" d="M340 530 C570 530 650 375 860 310"/><text x="475" y="500" class="small">Mismo protocolo de comandos</text>

  <rect class="box" x="880" y="475" width="250" height="130"/>
  <text x="915" y="525" class="title">EEPROM</text>
  <text x="915" y="562" class="sub">Configuración persistente</text>
  <path class="line" d="M1005 360 V475"/>

  <rect class="box" x="1200" y="140" width="240" height="420"/>
  <text x="1225" y="195" class="title">Salidas</text>
  <text x="1225" y="245" class="sub">SG90 · D8</text>
  <text x="1225" y="295" class="sub">3 LED · D6</text>
  <text x="1225" y="345" class="sub">Buzzer · D12</text>
  <text x="1225" y="395" class="sub">LCD · I2C</text>
  <text x="1225" y="465" class="small">Fuente externa 5 V</text>
  <text x="1225" y="495" class="small">para servo y LEDs</text>
  <path class="line" d="M1160 260 H1200"/>

  <text x="70" y="675" class="small">La interfaz confirma comandos aceptados por el servidor; la transmisión y la respuesta del Arduino dependen de una conexión serial activa.</text>
</svg>
